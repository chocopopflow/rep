<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
  }

  .wrap {
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #000;
  }

  video {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }

  /* Controls bar */
  .controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 12px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0;
    transition: opacity .25s;
  }
  .wrap:hover .controls,
  .wrap.paused .controls { opacity: 1; }

  /* Progress */
  .progress {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,.25);
    border-radius: 2px;
    cursor: pointer;
    transition: height .15s;
  }
  .progress:hover { height: 6px; }
  .progress-fill {
    height: 100%;
    background: #e00;
    border-radius: 2px;
    pointer-events: none;
    width: 0%;
  }
  .progress-buf {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: rgba(255,255,255,.2);
    border-radius: 2px;
    pointer-events: none;
    width: 0%;
  }

  /* Bottom row */
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  button {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    opacity: .85;
    transition: opacity .15s, transform .1s;
  }
  button:hover { opacity: 1; transform: scale(1.1); }
  button svg { width: 20px; height: 20px; fill: #fff; }

  .time {
    color: #fff;
    font-size: 12px;
    letter-spacing: .03em;
    opacity: .85;
    white-space: nowrap;
  }

  .spacer { flex: 1; }

  /* Volume */
  .vol-group { display: flex; align-items: center; gap: 4px; }
  input[type=range] {
    -webkit-appearance: none;
    width: 70px;
    height: 3px;
    background: rgba(255,255,255,.35);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
  }

  /* Live badge */
  .live {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: .08em;
    color: #fff;
    background: #e00;
    padding: 2px 6px;
    border-radius: 3px;
    display: none;
  }
  .live.show { display: inline-block; }

  /* Loading spinner */
  .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
  }
  .spinner.show { opacity: 1; }
  .spinner::after {
    content: '';
    width: 44px; height: 44px;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Error */
  .error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: #fff;
    font-size: 14px;
    opacity: .7;
  }
  .error.show { display: flex; }
</style>
</head>
<body>
<div class="wrap paused" id="wrap">
  <video id="vid" playsinline></video>

  <div class="spinner show" id="spinner"></div>
  <div class="error" id="error">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="rgba(255,255,255,.6)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    <span id="errorMsg">No se pudo cargar el stream.</span>
  </div>

  <div class="controls" id="controls">
    <div class="progress" id="progress">
      <div class="progress-buf" id="buf"></div>
      <div class="progress-fill" id="fill"></div>
    </div>
    <div class="row">
      <button id="btnPlay" title="Play/Pause">
        <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <span class="live" id="liveBadge">● EN VIVO</span>
      <div class="vol-group">
        <button id="btnMute" title="Mute">
          <svg id="icoVol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.97z"/></svg>
        </button>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
      </div>
      <span class="time" id="time">0:00 / 0:00</span>
      <div class="spacer"></div>
      <button id="btnFs" title="Pantalla completa">
        <svg id="icoFs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const SRC = 'http://181.13.252.102:8000/play/a0bc/index.m3u8?hls';

const vid      = document.getElementById('vid');
const wrap     = document.getElementById('wrap');
const spinner  = document.getElementById('spinner');
const errDiv   = document.getElementById('error');
const errMsg   = document.getElementById('errorMsg');
const btnPlay  = document.getElementById('btnPlay');
const icoPlay  = document.getElementById('icoPlay');
const btnMute  = document.getElementById('btnMute');
const icoVol   = document.getElementById('icoVol');
const volSlide = document.getElementById('vol');
const timeEl   = document.getElementById('time');
const fill     = document.getElementById('fill');
const buf      = document.getElementById('buf');
const progress = document.getElementById('progress');
const btnFs    = document.getElementById('btnFs');
const liveBadge= document.getElementById('liveBadge');

// HLS setup
let isLive = false;
let hlsInstance = null;
let tried = 0;

const SOURCES = [
  SRC,
  'https://corsproxy.io/?' + encodeURIComponent(SRC),
  'https://api.allorigins.win/raw?url=' + encodeURIComponent(SRC),
];

function loadHls(url) {
  if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  const hls = new Hls({ lowLatencyMode: true, xhrSetup: xhr => { xhr.withCredentials = false; } });
  hlsInstance = hls;
  hls.loadSource(url);
  hls.attachMedia(vid);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    isLive = vid.duration === Infinity;
    if (isLive) liveBadge.classList.add('show');
    vid.play().catch(()=>{});
  });
  hls.on(Hls.Events.ERROR, (_, d) => {
    if (d.fatal) {
      tried++;
      if (tried < SOURCES.length) {
        loadHls(SOURCES[tried]);
      } else {
        showError('No se pudo conectar al stream. Puede estar caído o bloqueado por CORS.');
      }
    }
  });
}

if (Hls.isSupported()) {
  loadHls(SOURCES[tried]);
} else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
  vid.src = SRC;
  vid.addEventListener('loadedmetadata', () => vid.play());
} else {
  showError('Tu navegador no soporta HLS.');
}

function showError(msg) {
  spinner.classList.remove('show');
  errMsg.textContent = msg;
  errDiv.classList.add('show');
}

// Play / pause icons
const PLAY_PATH  = 'M8 5v14l11-7z';
const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

function updatePlayIcon() {
  icoPlay.querySelector('path').setAttribute('d', vid.paused ? PLAY_PATH : PAUSE_PATH);
  wrap.classList.toggle('paused', vid.paused);
}

btnPlay.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
vid.addEventListener('click',     () => vid.paused ? vid.play() : vid.pause());
vid.addEventListener('play',      updatePlayIcon);
vid.addEventListener('pause',     updatePlayIcon);

// Spinner
vid.addEventListener('waiting',  () => spinner.classList.add('show'));
vid.addEventListener('playing',  () => { spinner.classList.remove('show'); errDiv.classList.remove('show'); });
vid.addEventListener('canplay',  () => spinner.classList.remove('show'));

// Time & progress
function fmt(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s/60), sec = s%60;
  return m + ':' + String(sec).padStart(2,'0');
}
vid.addEventListener('timeupdate', () => {
  const dur = vid.duration || 0;
  const cur = vid.currentTime || 0;
  if (isLive || dur === Infinity) {
    timeEl.textContent = 'EN VIVO';
    fill.style.width = '100%';
  } else {
    timeEl.textContent = fmt(cur) + ' / ' + fmt(dur);
    fill.style.width = (dur ? (cur/dur*100) : 0) + '%';
  }
  if (vid.buffered.length) {
    const b = vid.buffered.end(vid.buffered.length-1);
    buf.style.width = (dur ? (b/dur*100) : 0) + '%';
  }
});

progress.addEventListener('click', e => {
  if (vid.duration && vid.duration !== Infinity) {
    const r = progress.getBoundingClientRect();
    vid.currentTime = ((e.clientX - r.left) / r.width) * vid.duration;
  }
});

// Volume
btnMute.addEventListener('click', () => {
  vid.muted = !vid.muted;
  volSlide.value = vid.muted ? 0 : vid.volume;
  updateVolIcon();
});
volSlide.addEventListener('input', () => {
  vid.volume = volSlide.value;
  vid.muted  = vid.volume === 0;
  updateVolIcon();
});
function updateVolIcon() {
  const v = vid.muted || vid.volume === 0;
  icoVol.querySelector('path').setAttribute('d', v
    ? 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z'
    : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.97z'
  );
}

// Fullscreen
btnFs.addEventListener('click', () => {
  if (!document.fullscreenElement) wrap.requestFullscreen();
  else document.exitFullscreen();
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  icoFs.querySelector('path').setAttribute('d', fs
    ? 'M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z'
    : 'M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z'
  );
});
</script>
</body>
</html>
